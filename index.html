<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Sora:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#0F3764" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bem Aviv Hub" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Bem Aviv Hub</title>
    <script>
      (function() {
        var path = window.location.pathname.toLowerCase();
        var manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.id = 'app-manifest-link';

        var appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
        var themeMeta = document.querySelector('meta[name="theme-color"]');

        if (path.startsWith('/v2/orcamento')) {
          manifestLink.href = '/manifest-orcamento.webmanifest';
          if (appleIcon) appleIcon.href = '/apple-touch-icon-orcamento.png';
          if (themeMeta) themeMeta.content = '#0F3764';
          document.title = 'Bem Aviv Orçamentos';
        } else if (path.startsWith('/v2')) {
          manifestLink.href = '/manifest-v2.webmanifest';
          if (appleIcon) appleIcon.href = '/apple-touch-icon.png';
          if (themeMeta) themeMeta.content = '#FFFFFF';
          document.title = 'Bem Aviv V2';
        } else {
          manifestLink.href = '/manifest-gestao.webmanifest';
          if (appleIcon) appleIcon.href = '/apple-touch-icon.png';
          if (themeMeta) themeMeta.content = '#FFFFFF';
          document.title = 'Bem Aviv Gestão';
        }
        document.head.appendChild(manifestLink);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
