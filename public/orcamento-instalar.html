<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Orçamento Mobile — Bem Aviv</title>
    <meta name="description" content="App de orçamentos para vendedores Bem Aviv. Tabela de preços, propostas e CRM." />

    <!-- PWA: manifest dedicado ao módulo de orçamento -->
    <link rel="manifest" href="/api/orcamento-manifest" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Orçamentos" />
    <link rel="apple-touch-icon" href="/pwa-orcamento-192x192.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#7DC344" />
    <meta name="msapplication-TileColor" content="#7DC344" />

    <!-- Ícones -->
    <link rel="icon" type="image/png" href="/pwa-orcamento-192x192.png" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #F4F8F3;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 24px;
        text-align: center;
        gap: 16px;
      }
      img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 24px rgba(125,195,68,0.3); }
      h1 { font-size: 1.4rem; font-weight: 800; color: #1a2e1a; }
      p { font-size: 0.9rem; color: #555; max-width: 300px; line-height: 1.5; }
      .spinner {
        width: 36px; height: 36px;
        border: 3px solid #d4edbc;
        border-top-color: #7DC344;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <img src="/pwa-orcamento-192x192.png" alt="Orçamento Mobile" />
    <h1>Orçamento Mobile</h1>
    <p>Carregando o app de orçamentos Bem Aviv...</p>
    <div class="spinner"></div>

    <script>
      // Redireciona para o app React após registrar o manifest
      // O timeout curto garante que o browser processe o manifest antes de navegar
      setTimeout(function() {
        window.location.replace('/v2/orcamento/login');
      }, 800);
    </script>
  </body>
</html>
